name: Harvest pet style boxes

on:
  workflow_dispatch:
    inputs:
      style:
        description: 'Style number (the inbox fills this in; leave empty for a full nightly run)'
        required: false
        default: ''
  schedule:
    - cron: '40 5 * * *'

permissions:
  contents: write

concurrency:
  group: harvest-styles
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the matcher's dependencies
        working-directory: active-box
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Measure
        working-directory: active-box
        env:
          ABOX_CACHE: ${{ github.workspace }}/active-box
          ABOX_BULK: ${{ github.workspace }}/bulk_clean.js
          ABOX_STYLE_INDEX: ${{ github.workspace }}/style-index.json
          ABOX_IMG: ${{ runner.temp }}/abox-img
          ABOX_PROBLEMS: ${{ runner.temp }}/abox-problems.txt
          ABOX_STYLE: ${{ inputs.style }}
          CHROME_PATH: /usr/bin/google-chrome
          STYLE_SINK_KEY: ${{ secrets.STYLE_SINK_KEY }}
        run: node harvest-styles.js

      - name: Commit if anything changed
        run: |
          git config user.name  "DTI Remix"
          git config user.email "dti-remix@users.noreply.github.com"
          if [ ! -e active-box/style-roster.json ]; then git rm -q --cached --ignore-unmatch active-box/style-roster.json; fi
          git add active-box/harvested.json active-box/style-crops.json
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -q -m "data: pet style box harvest"
          for i in 1 2 3; do
            if git push -q; then exit 0; fi
            git pull -q --rebase || break
          done
          echo "could not push the harvest"
          exit 1

      - name: Fail loudly if anything went wrong
        run: |
          f="${{ runner.temp }}/abox-problems.txt"
          if [ -s "$f" ]; then
            echo "This run could not do everything it should:"
            cat "$f"
            exit 1
          fi
          echo "all good"
